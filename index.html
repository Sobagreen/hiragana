<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хирагана: Найди пары</title>
  <style>
    :root {
      color-scheme: light;
      --bg-gradient: linear-gradient(160deg, #0ea5e9 0%, #6366f1 48%, #f472b6 100%);
      --surface: rgba(255, 255, 255, 0.18);
      --surface-strong: rgba(255, 255, 255, 0.35);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(99, 102, 241, 0.45);
      --text-primary: #0f172a;
      --accent: #facc15;
      --success: #22c55e;
      --danger: #ef4444;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      color: var(--text-primary);
      padding: clamp(12px, 4vw, 40px);
      -webkit-text-size-adjust: 100%;
      background-attachment: fixed;
    }

    .game-wrapper {
      width: min(1100px, 100%);
      backdrop-filter: blur(18px);
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.2);
      padding: clamp(16px, 3vw, 36px);
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 3vw, 32px);
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0f172a;
    }

    .subtitle {
      margin: 0;
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      color: rgba(15, 23, 42, 0.7);
    }

    .status-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      background: var(--surface-strong);
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .status-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      color: rgba(15, 23, 42, 0.7);
    }

    .status-item strong {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: #0f172a;
      font-weight: 600;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 10px 18px;
      background: linear-gradient(135deg, #facc15, #fb923c);
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 24px rgba(250, 204, 21, 0.35);
      font-size: 0.95rem;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      transform: translateY(-1px) scale(1.01);
      box-shadow: 0 18px 30px rgba(251, 191, 36, 0.45);
    }

    button:active {
      transform: translateY(1px) scale(0.99);
    }

    #result {
      display: none;
      text-align: center;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.9);
      padding: clamp(12px, 3vw, 20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 15px 35px rgba(15, 23, 42, 0.15);
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(16px, 3vw, 28px);
    }

    @media (max-width: 900px) {
      .columns {
        grid-template-columns: 1fr;
      }
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(255, 255, 255, 0.82);
      padding: clamp(12px, 2.5vw, 22px);
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 15px 30px rgba(15, 23, 42, 0.1);
    }

    .column h3 {
      margin: 0;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      letter-spacing: -0.01em;
      text-align: center;
      color: #1f2937;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(62px, 1fr));
      gap: clamp(8px, 2vw, 14px);
    }

    @media (max-width: 540px) {
      .grid {
        grid-template-columns: repeat(auto-fit, minmax(46px, 1fr));
        gap: 6px;
      }
    }

    .card {
      position: relative;
      padding: 12px 4px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 2px solid transparent;
      font-size: clamp(1rem, 4vw, 1.35rem);
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e293b;
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.12);
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 32px rgba(79, 70, 229, 0.18);
    }

    .card.selected {
      border-color: var(--accent);
      box-shadow: 0 12px 26px rgba(250, 204, 21, 0.4);
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.2), rgba(253, 186, 116, 0.2));
    }

    .card.correct {
      border-color: var(--success);
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(134, 239, 172, 0.3));
    }

    .card.incorrect {
      border-color: var(--danger);
      background: linear-gradient(135deg, rgba(248, 113, 113, 0.2), rgba(254, 202, 202, 0.35));
    }

    .card.matched {
      transform: scale(0.75);
      opacity: 0;
      pointer-events: none;
    }

    .card.shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-2px); }
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: rgba(15, 23, 42, 0.55);
    }

    @media (max-width: 540px) {
      body {
        padding: clamp(10px, 3vw, 18px);
      }

      .game-wrapper {
        border-radius: 22px;
        padding: clamp(14px, 4vw, 24px);
        gap: clamp(12px, 4vw, 20px);
      }

      .status-bar {
        gap: 8px;
        padding: 10px;
      }

      .column {
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>

  <main class="game-wrapper">
    <header>
      <h1>🧠 Хирагана: Найди пары</h1>
      <p class="subtitle">Совмещайте символы и их чтение, тренируя память и чувство языка.</p>

      <div class="status-bar">
        <div class="status-item">
          <span>Время</span>
          <strong id="time-elapsed">00:00</strong>
        </div>
        <div class="status-item">
          <span>Ошибки</span>
          <strong id="errors-count">0</strong>
        </div>
        <div class="status-item">
          <span>Найдено</span>
          <strong><span id="matches-count">0</span>/<span id="total-count">0</span></strong>
        </div>
      </div>

      <div class="actions">
        <button id="restart-btn" type="button">Начать заново</button>
      </div>
    </header>

    <div id="result"></div>

    <div class="columns">
      <div class="column">
        <h3>Хирагана</h3>
        <div class="grid" id="hiragana-column"></div>
      </div>
      <div class="column">
        <h3>Транскрипция</h3>
        <div class="grid" id="romaji-column"></div>
      </div>
    </div>

    <footer>Совершенствуйте японский каждый день 💮</footer>
  </main>

  <script>
    const symbols = [
      { char: 'あ', romaji: 'a' }, { char: 'い', romaji: 'i' }, { char: 'う', romaji: 'u' }, { char: 'え', romaji: 'e' }, { char: 'お', romaji: 'o' },
      { char: 'か', romaji: 'ka' }, { char: 'き', romaji: 'ki' }, { char: 'く', romaji: 'ku' }, { char: 'け', romaji: 'ke' }, { char: 'こ', romaji: 'ko' },
      { char: 'さ', romaji: 'sa' }, { char: 'し', romaji: 'shi' }, { char: 'す', romaji: 'su' }, { char: 'せ', romaji: 'se' }, { char: 'そ', romaji: 'so' },
      { char: 'た', romaji: 'ta' }, { char: 'ち', romaji: 'chi' }, { char: 'つ', romaji: 'tsu' }, { char: 'て', romaji: 'te' }, { char: 'と', romaji: 'to' },
      { char: 'な', romaji: 'na' }, { char: 'に', romaji: 'ni' }, { char: 'ぬ', romaji: 'nu' }, { char: 'ね', romaji: 'ne' }, { char: 'の', romaji: 'no' },
      { char: 'は', romaji: 'ha' }, { char: 'ひ', romaji: 'hi' }, { char: 'ふ', romaji: 'fu' }, { char: 'へ', romaji: 'he' }, { char: 'ほ', romaji: 'ho' },
      { char: 'ま', romaji: 'ma' }, { char: 'み', romaji: 'mi' }, { char: 'む', romaji: 'mu' }, { char: 'め', romaji: 'me' }, { char: 'も', romaji: 'mo' },
      { char: 'や', romaji: 'ya' }, { char: 'ゆ', romaji: 'yu' }, { char: 'よ', romaji: 'yo' }, { char: 'ら', romaji: 'ra' }, { char: 'り', romaji: 'ri' },
      { char: 'る', romaji: 'ru' }, { char: 'れ', romaji: 're' }, { char: 'ろ', romaji: 'ro' }, { char: 'わ', romaji: 'wa' }, { char: 'を', romaji: 'wo' },
      { char: 'ん', romaji: 'n' }
    ];

    let selected = [];
    let matched = 0;
    let errors = 0;
    let startTime;
    let timerInterval;
    let isLocked = false;

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function formatTime(seconds) {
      const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function updateTime() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById("time-elapsed").textContent = formatTime(elapsed);
    }

    function updateStats() {
      document.getElementById("errors-count").textContent = errors;
      document.getElementById("matches-count").textContent = matched;
    }

    function createCards() {
      const hContainer = document.getElementById("hiragana-column");
      const rContainer = document.getElementById("romaji-column");

      // Clear previous cards
      hContainer.innerHTML = '';
      rContainer.innerHTML = '';

      const shuffledChars = shuffle(symbols);
      const shuffledRomaji = shuffle(symbols);

      shuffledChars.forEach(item => {
        const hCard = document.createElement("div");
        hCard.className = "card";
        hCard.textContent = item.char;
        hCard.dataset.key = item.romaji;
        hCard.dataset.type = "char";
        hContainer.appendChild(hCard);
      });

      shuffledRomaji.forEach(item => {
        const rCard = document.createElement("div");
        rCard.className = "card";
        rCard.textContent = item.romaji;
        rCard.dataset.key = item.romaji;
        rCard.dataset.type = "romaji";
        rContainer.appendChild(rCard);
      });
    }

    function handleCardClick(e) {
      const card = e.target.closest(".card");
      if (!card || card.classList.contains("matched") || selected.includes(card) || isLocked) return;

      if (selected.length === 1 && selected[0].dataset.type === card.dataset.type) {
        card.classList.add("shake");
        setTimeout(() => card.classList.remove("shake"), 400);
        return;
      }

      card.classList.add("selected");
      selected.push(card);

      if (selected.length === 2) {
        isLocked = true;
        const [a, b] = selected;
        if (a.dataset.key === b.dataset.key && a.dataset.type !== b.dataset.type) {
          a.classList.add("correct", "matched");
          b.classList.add("correct", "matched");
          setTimeout(() => {
            a.remove();
            b.remove();
            matched++;
            updateStats();
            if (matched === symbols.length) {
              showResult();
            }
            resetSelection();
          }, 260);
        } else {
          a.classList.add("incorrect");
          b.classList.add("incorrect");
          errors++;
          updateStats();
          setTimeout(() => {
            a.classList.remove("selected", "incorrect");
            b.classList.remove("selected", "incorrect");
            resetSelection();
          }, 500);
        }
      }
    }

    function resetSelection() {
      selected = [];
      isLocked = false;
    }

    function showResult() {
      const time = Math.floor((Date.now() - startTime) / 1000);
      const result = document.getElementById("result");
      result.style.display = "block";
      result.innerHTML = `
        <strong>🎉 Вы победили!</strong><br>
        ⏱ Время: <b>${time} сек</b><br>
        ❌ Ошибки: <b>${errors}</b><br>
        Спасибо за игру! 😊
      `;
      clearInterval(timerInterval);
    }

    function initGame() {
      startTime = Date.now();
      matched = 0;
      errors = 0;
      selected = [];
      isLocked = false;
      document.getElementById("result").style.display = "none";
      document.getElementById("total-count").textContent = symbols.length;
      updateStats();
      clearInterval(timerInterval);
      updateTime();
      timerInterval = setInterval(updateTime, 1000);
      createCards();

      // Remove previous event listeners
      document.querySelectorAll(".card").forEach(card => {
        card.removeEventListener("click", handleCardClick);
      });
      
      // Add new event listeners
      document.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", handleCardClick);
      });
    }

    document.getElementById("restart-btn").addEventListener("click", () => {
      initGame();
    });

    document.addEventListener("DOMContentLoaded", initGame);
  </script>
</body>
</html>
